<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Le cacatov, le coktail le plus odorant de la mama.">
    <title>Coktail de la caca</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="hud">
        <a class="logo" href="coktail1.html">💣 Coktails</a>
        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="coktail1.html">Molotov</a></li>
                <li><a href="cokatail2.html" aria-current="page">Cacatov</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div>
                <h1>Cacatov</h1>
                <p class="accroche">Le coktail qui ne laisse personne indifférent. Surtout pas le nez.</p>
            </div>
            <img class="photo" src="./img/Puputovs.jpg" alt="Trois bocaux de cacatov" width="330" height="186">
        </section>

        <div class="cartes">
            <section id="section_ingredients" class="carte">
                <h2>Ce que tu obtiens</h2>
                <ul>
                    <li class="gras taille">De l'explosion</li>
                    <li class="gras taille">De l'odeur</li>
                    <li class="gras taille">Et du fun</li>
                </ul>
            </section>
        </div>

        <section class="action">
            <button class="bouton" id="bombe" type="button">Lancer le cacatov</button>
            <p class="statut" id="statut" aria-live="polite"></p>
        </section>

        <a class="lien-suivant" href="coktail1.html" title="Retour au coktail de la mama">← Coktail de la mama</a>
    </main>

    <footer>
        <p>Coktails de la mama — à consommer avec modération (ou pas)</p>
    </footer>

    <div class="flash" aria-hidden="true"></div>
    <p class="toast" aria-hidden="true">Target Successfully Bombed!</p>
</body>
</html>
